name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL || 'https://doctor-tracker-backend.onrender.com' }}"
          echo "Pinging $BACKEND_URL/api/health"
          curl -s -f -m 30 "$BACKEND_URL/api/health" || echo "Ping failed or server waking up"
